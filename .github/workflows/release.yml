name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-worker:
    name: validate rust worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check worker
        run: cargo check --target wasm32-unknown-unknown

  build-linux-android:
    name: build linux and android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Build Linux release bundle
        run: flutter build linux --release
      - name: Package release artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/rtc-transfer-${{ github.ref_name }}-android.apk
          tar -czf release/rtc-transfer-${{ github.ref_name }}-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: release/*
          if-no-files-found: error

  build-windows:
    name: build windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release
      - name: Package release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/rtc-transfer-${{ github.ref_name }}-windows-x64.zip -Force
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  build-apple:
    name: build iOS and macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Build macOS release app
        run: flutter build macos --release
      - name: Package Apple artifacts
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release/rtc-transfer-${{ github.ref_name }}-ios-unsigned.zip
          mac_app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$mac_app"
          ditto -c -k --sequesterRsrc --keepParent "$mac_app" release/rtc-transfer-${{ github.ref_name }}-macos-unsigned.zip
      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: release/*
          if-no-files-found: error

  publish-release:
    name: publish release
    needs: [validate-worker, build-linux-android, build-windows, build-apple]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
